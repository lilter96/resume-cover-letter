groups:
  - name: resume_generator_alerts
    rules:
      # High Error Rate
      - alert: HighErrorRate
        expr: rate(resume_generator_errors_total[5m]) > 0.1
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High error rate detected"
          description: "Error rate is {{ $value }} errors per second"

      # LLM API Failures
      - alert: LLMAPIFailures
        expr: rate(resume_generator_llm_requests_total{status="error"}[5m]) > 0.05
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "LLM API failures detected"
          description: "LLM API failure rate is {{ $value }} per second"

      # High LLM Costs
      - alert: HighLLMCosts
        expr: increase(resume_generator_llm_cost_usd_total[1h]) > 10
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "High LLM costs detected"
          description: "LLM costs in the last hour: ${{ $value }}"

      # Low Daily Active Users
      - alert: LowDAU
        expr: resume_generator_users_active_daily < 5
        for: 30m
        labels:
          severity: info
        annotations:
          summary: "Low daily active users"
          description: "Only {{ $value }} active users today"

      # Payment Processing Failures
      - alert: PaymentFailures
        expr: rate(resume_generator_payments_total{status="error"}[10m]) > 0.01
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Payment processing failures"
          description: "Payment failure rate: {{ $value }} per second"

      # High Response Time
      - alert: HighResponseTime
        expr: histogram_quantile(0.95, rate(resume_generator_http_request_duration_seconds_bucket[5m])) > 5
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "High response time"
          description: "95th percentile response time is {{ $value }}s"

      # Low Credit Balance
      - alert: LowSystemCredits
        expr: resume_generator_credits_balance_total < 100
        for: 5m
        labels:
          severity: info
        annotations:
          summary: "Low system credit balance"
          description: "Total credits across all users: {{ $value }}"

      # Application Down
      - alert: ApplicationDown
        expr: up{job="resume-generator"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Resume Generator application is down"
          description: "The application has been down for more than 1 minute"

  - name: infrastructure_alerts
    rules:
      # High CPU Usage
      - alert: HighCPUUsage
        expr: 100 - (avg by(instance) (irate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High CPU usage"
          description: "CPU usage is {{ $value }}%"

      # High Memory Usage
      - alert: HighMemoryUsage
        expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High memory usage"
          description: "Memory usage is {{ $value }}%"

      # Low Disk Space
      - alert: LowDiskSpace
        expr: (1 - (node_filesystem_avail_bytes / node_filesystem_size_bytes)) * 100 > 90
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Low disk space"
          description: "Disk usage is {{ $value }}%"