global:
  smtp_smarthost: 'localhost:587'
  smtp_from: 'alerts@resumegen.pro'
  smtp_auth_username: 'alerts@resumegen.pro'
  smtp_auth_password: 'your-email-password'

route:
  group_by: ['alertname']
  group_wait: 10s
  group_interval: 10s
  repeat_interval: 1h
  receiver: 'web.hook'
  routes:
    - match:
        severity: critical
      receiver: 'critical-alerts'
    - match:
        severity: warning
      receiver: 'warning-alerts'
    - match:
        severity: info
      receiver: 'info-alerts'

receivers:
  - name: 'web.hook'
    webhook_configs:
      - url: 'http://127.0.0.1:5001/'

  - name: 'critical-alerts'
    email_configs:
      - to: 'admin@resumegen.pro'
        subject: 'CRITICAL: Resume Generator Alert'
        body: |
          Alert: {{ .GroupLabels.alertname }}
          Summary: {{ range .Alerts }}{{ .Annotations.summary }}{{ end }}
          Description: {{ range .Alerts }}{{ .Annotations.description }}{{ end }}
          
          Severity: CRITICAL
          Time: {{ range .Alerts }}{{ .StartsAt }}{{ end }}
    slack_configs:
      - api_url: 'YOUR_SLACK_WEBHOOK_URL'
        channel: '#alerts'
        title: 'CRITICAL Alert: Resume Generator'
        text: |
          Alert: {{ .GroupLabels.alertname }}
          {{ range .Alerts }}{{ .Annotations.summary }}{{ end }}

  - name: 'warning-alerts'
    email_configs:
      - to: 'admin@resumegen.pro'
        subject: 'WARNING: Resume Generator Alert'
        body: |
          Alert: {{ .GroupLabels.alertname }}
          Summary: {{ range .Alerts }}{{ .Annotations.summary }}{{ end }}
          Description: {{ range .Alerts }}{{ .Annotations.description }}{{ end }}
          
          Severity: WARNING
          Time: {{ range .Alerts }}{{ .StartsAt }}{{ end }}

  - name: 'info-alerts'
    email_configs:
      - to: 'monitoring@resumegen.pro'
        subject: 'INFO: Resume Generator Alert'
        body: |
          Alert: {{ .GroupLabels.alertname }}
          Summary: {{ range .Alerts }}{{ .Annotations.summary }}{{ end }}
          Description: {{ range .Alerts }}{{ .Annotations.description }}{{ end }}
          
          Severity: INFO
          Time: {{ range .Alerts }}{{ .StartsAt }}{{ end }}

inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'dev', 'instance']